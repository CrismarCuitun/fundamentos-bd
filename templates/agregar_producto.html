<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
</head>
<body>
    <h1>Agregar Nuevo Producto</h1>
    
    <form action="/agregar_producto" method="POST">
        <label>Nombre del Producto:</label><br>
        <input type="text" name="nombre" placeholder="Ej. Café Americano" required><br><br>
        
        <label>Categoría:</label><br>
        <input type="text" name="categoria" placeholder="Ej. Bebidas" required><br><br>
        
        <label>Precio:</label><br>
        <input type="number" step="0.01" name="precio" placeholder="0.00" required><br><br>
        
        <label>Stock Inicial:</label><br>
        <input type="number" name="stock" placeholder="Cantidad disponible" required><br><br>
        
        <button type="submit" style="padding: 10px 20px;">Agregar Producto</button>
        <a href="/productos"><button type="button" style="padding: 10px 20px;">Cancelar</button></a>
    </form>
</body>
</html
