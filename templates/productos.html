<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Cafetería</title>
</head>
<body>
    <h1>Lista de Productos</h1>
    <a href="/">← Volver al inicio</a>
    <br><br>

    <!-- TABLA SOLO DE VISUALIZACIÓN (SIN BOTONES DENTRO) -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.idproducto }}</td>
                <td>{{ p.nombre }}</td>
                <td>{{ p.categoria }}</td>
                <td>${{ p.precio }}</td>
                <td>{{ p.stock }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br><br>

    <!-- ÚNICOS 3 BOTONES DEBAJO DE LA TABLA -->
    <a href="/agregar_producto">
        <button style="padding: 10px 20px; margin-right: 10px;">Agregar</button>
    </a>

    <a href="/actualizar_producto">
        <button style="padding: 10px 20px; margin-right: 10px;">Actualizar</button>
    </a>

    <a href="/borrar_producto">
        <button style="padding: 10px 20px;">Borrar</button>
    </a>
</body>
</html>
