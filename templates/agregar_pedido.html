<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Pedido</title>
</head>
<body>
    <h1>Agregar Nuevo Pedido</h1>

    <form action="/agregar_pedido" method="POST">
        
        <!-- Escribir el nombre del cliente -->
        <label for="nombre_cliente">Nombre del Cliente:</label><br>
        <input type="text" name="nombre_cliente" id="nombre_cliente" placeholder="Ej. Gabriel" required><br><br>

        <!-- Fecha del Pedido -->
        <label for="fecha">Fecha de Pedido:</label><br>
        <input type="date" name="fecha_pedido" id="fecha" required><br><br>

        <!-- Estado del Pedido (Solo las opciones existentes en tu BD) -->
        <label for="estado">Estado:</label><br>
        <select name="estado" id="estado" required>
            <option value="Pendiente">Pendiente</option>
            <option value="Entregado">Entregado</option>
        </select><br><br>

        <!-- Botones de Acción -->
        <button type="submit">Guardar Pedido</button>
        <a href="/pedidos"><button type="button">Cancelar</button></a>

    </form>
</body>
</html>
