<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - Cafetería</title>
</head>
<body>
    <h1>Lista de Pedidos</h1>
    <a href="/">← Volver al inicio</a>
    <br><br>

    <!-- TABLA SOLO DE VISUALIZACIÓN (SIN BOTONES DENTRO) -->
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for ped in pedidos %}
            <tr>
                <td>{{ ped.idpedido }}</td>
                <td>{{ ped.cliente }}</td>
                <td>{{ ped.fecha }}</td>
                <td>{{ ped.estado }}</td>
                <td>${{ ped.total }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br><br>

    <!-- ÚNICOS 3 BOTONES DEBAJO DE LA TABLA -->
    <!-- <a href="/agregar_pedido">
        <button style="padding: 10px 20px; margin-right: 10px;">Agregar</button>
    </a>

    <a href="/actualizar_pedido">
        <button style="padding: 10px 20px; margin-right: 10px;">Actualizar</button>
    </a>

    <a href="/borrar_pedido">
        <button style="padding: 10px 20px;">Borrar</button>
    </a> -->
    <!-- SECCIÓN DE BOTONES DEBAJO DE LA TABLA -->
    <a href="/agregar_pedido">
        <button style="padding: 10px 20px; margin-right: 10px;">Agregar</button>
    </a>

    <!-- Formulario para ingresar el ID del pedido a actualizar -->
    <form action="/buscar_actualizar_pedido" method="POST" style="display: inline-block; margin-right: 10px;">
        <input type="number" name="idpedido" placeholder="ID a actualizar" required style="padding: 8px; width: 110px;">
        <button type="submit" style="padding: 10px 20px;">Actualizar</button>
    </form>

    
<form action="/borrar_pedido" method="POST" style="display: inline-block;">
    <input type="number" name="idpedido" placeholder="ID a borrar" required style="padding: 8px; width: 100px;">
    <button type="submit" style="padding: 10px 20px;" onclick="return confirm('¿Seguro que deseas eliminar este pedido?');">Borrar</button>
</form>

</body>
</html>
